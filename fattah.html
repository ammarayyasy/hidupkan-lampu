<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lampu Hidup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #222;
      color: white;
      font-family: sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 20px;
    }
    .buttons {
      display: flex;
      gap: 10px;
      background-color: white;
      padding: 10px;
      border-radius: 30px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
    }
    .btn-hidup {
      background-color: gold;
      color: black;
    }
    .btn-mati {
      background-color: white;
      color: white;
    }
    .box {
      position: relative;
      width: 400px;
      height: 400px;
      font-size: 5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 15px;
      overflow: hidden;
      background-color: rgba(0,0,0,0.6); /* default: mati */
      transition: background-color 0.4s ease;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box" id="lampu">
      👨‍👩‍👦‍👦
    </div>
    <div class="buttons">
      <button id="hidup" class="btn-hidup" onclick="hidup()">Nyalain</button>
      <button id="mati" class="btn-mati" onclick="mati()">Matiin</button>
    </div>
  </div>

  <script>
    const lampu = document.getElementById("lampu");
    const btnHidup = document.getElementById('hidup');
    const btnMati = document.getElementById("mati");

    function hidup() {
        lampu.style.backgroundColor = "rgba(255, 255, 0, 0.4)";
        btnHidup.style.backgroundColor = "white";
        btnHidup.style.color = "white";
        btnMati.style.backgroundColor = "gold";
        btnMati.style.color = "black";
    }

    function mati() {
        lampu.style.backgroundColor = "rgba(0, 0, 0, 0.6)";
        btnMati.style.backgroundColor = "white";
        btnMati.style.color = "white";
        btnHidup.style.backgroundColor = "gold";
        btnHidup.style.color = "black";
    }
    /* 
      Task 1: Buat function hidup() untuk merubah background-color lampu menjadi warna: rgba(255, 255, 0, 0.4)
      Task 2: Buat function mati() untuk merubah background-color lampu menjadi warna: rgba(0,0,0,0.6)
    */
  </script>
</body>
</html>
